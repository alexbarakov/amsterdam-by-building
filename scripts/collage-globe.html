<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#0b0b0b}canvas{display:block}</style>
<canvas id="c" width="1440" height="1080"></canvas>
<script src="d3.min.js"></script>
<script src="topojson.min.js"></script>
<script src="land.js"></script>
<script src="places.js"></script>
<script>
/* Building by building: the collage splits, the films fly to their cities on a turning globe, Paris first,
   then Amsterdam, then everyone else; each city stays as a pulsing red dot, and the whole globe builds up. renderFrame(i) draws frame i at 30 fps. */
const FPS = 30, W = 1440, H = 1080, CX = 720, CY = 575, R = 395, RED = '#ec0000';
const cv = document.getElementById('c'), g = cv.getContext('2d');
const land = topojson.feature(LAND, LAND.objects.land);
const CITIES = [
  // id, label, lon, lat, author
  ['paris', 'Paris', 2.35, 48.86], ['amsterdam', 'Amsterdam', 4.90, 52.37], ['spb', 'St. Petersburg', 30.31, 59.94],
  ['london', 'London', -0.13, 51.51], ['sydney', 'Sydney', 151.21, -33.87], ['cdmx', 'Mexico City', -99.13, 19.43],
  ['rome', 'Rome', 12.50, 41.90], ['milan', 'Milan', 9.19, 45.46], ['italia', 'Pavia', 9.16, 45.19],
  ['saopaulo', 'São Paulo', -46.63, -23.55], ['sevilla', 'Seville', -5.98, 37.39], ['montpellier', 'Montpellier', 3.88, 43.61],
  ['nantes', 'Nantes', -1.55, 47.22], ['helsinki', 'Helsinki', 24.94, 60.17], ['sion', 'Sion', 7.36, 46.23],
];
const FRAMES = window.FRAMES || {};   // id → number of extracted frames
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
const clamp01 = t => Math.max(0, Math.min(1, t));
const lerp = (a, b, t) => a + (b - a) * t;

// --- the timeline (seconds) ---
const T_SPLIT = 6.8, T_ORBIT = 7.7, T_PARIS = 7.9, T_AMS = 8.9, T_EUROPE = 9.8, T_TURN = 11.2, T_TURN_END = 16, T_END = 16;
// Everything plays 1.2 times slower than these times say; the film lasts T_END × SLOW seconds.
const SLOW = 1.2;
window.DURATION = T_END * SLOW;
// Push-ins on the grid: Paris, Amsterdam, St. Petersburg, then the whole grid again.
// ×4 is exactly one 4:3 cell filling the 4:3 frame: the city alone, nothing cut at the edges.
const GRID_SHOTS = [[0, 1, null], [0.6, 1, null], [1.2, 4, 'paris'], [2.8, 4, 'paris'], [3.3, 4, 'amsterdam'], [4.9, 4, 'amsterdam'], [5.4, 4, 'spb'], [6.3, 4, 'spb'], [6.8, 1, null]];
// The globe opens close on Paris and Amsterdam and pulls back once they have landed.
const GLOBE_ZOOM = [[T_SPLIT, 3.4], [T_AMS + 0.7, 3.4], [T_EUROPE + 0.6, 1]];
const FLY = 1.0;
// The globe faces Europe, then turns once around to the west and comes back to Europe.
function centreLon(t) { return lerp(3.6, 4, 1 - zoomK(t)) - 360 * ease(clamp01((t - T_TURN) / (T_TURN_END - T_TURN))); }
function keyed(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], ease((t - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0])));
  return keys.at(-1)[1];
}
const globeZoom = t => keyed(GLOBE_ZOOM, t);
const zoomK = t => (globeZoom(t) - 1) / 2.4;            // 1 close on Paris and Amsterdam, 0 the whole globe
const centreLat = t => lerp(22, 50.5, zoomK(t));
// When each city lands. The far ones wait for the turn to bring them round.
const LAND_AT = { paris: T_PARIS, amsterdam: T_AMS };
const europe = ['london', 'nantes', 'montpellier', 'sion', 'milan', 'italia', 'rome', 'sevilla', 'helsinki', 'spb'];
europe.forEach((id, i) => { LAND_AT[id] = T_EUROPE + i * 0.1; });
// lon at the centre when the city faces us: centreLon(t) = city lon
function timeFacing(lon) {
  for (let t = T_TURN; t < T_TURN_END; t += 0.01) { let d = ((centreLon(t) - lon) % 360 + 540) % 360 - 180; if (Math.abs(d) < 30) return t; }
  return T_TURN_END;
}
LAND_AT.saopaulo = timeFacing(-46.63) - FLY * 0.8;
LAND_AT.cdmx = timeFacing(-99.13) - FLY * 0.8;
LAND_AT.sydney = timeFacing(151.21) - FLY * 0.8;

// --- layout of the opening grid: a title cell, then the fifteen films ---
// Dark and light maps alternate: the five dark cells (title, Paris, London, Milan, Pavia) never touch side by side.
const ORDER = ['amsterdam', 'paris', 'spb', 'sydney', 'london', 'rome', 'cdmx', 'saopaulo', 'sevilla', 'montpellier', 'milan', 'nantes', 'helsinki', 'italia', 'sion'];
const gridCell = k => ({ x: (k % 4) * 360 + 180, y: Math.floor(k / 4) * 270 + 135, w: 360, h: 270 });
// waiting places around the globe, in the order the films leave
const orbit = {};
ORDER.forEach((id, i) => {
  const a = -Math.PI / 2 + (i + 0.5) * (2 * Math.PI / ORDER.length);
  orbit[id] = { x: CX + Math.cos(a) * 610, y: CY - 10 + Math.sin(a) * 440, w: 168, h: 126 };
});

// The whole world builds up: from Amsterdam outwards, every populated place on Earth (Natural Earth) rises as a
// little cluster of buildings in the map's period colours, taller where more people live.
const PERIOD_COLOURS = ['#4a1410', '#8c1c13', '#c0462b', '#d97a2b', '#e5b13a', '#8e9f3c', '#3f8f6b', '#2c7391', '#3a4f9a', '#6a3f8f'];
const T_COVER = 11.1, COVER_SPAN = 4.1, AMS = [4.90, 52.37];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const BARS = [];
for (const [lon, lat, pop] of (window.PLACES || [])) {
  const lp = Math.log10(Math.max(pop, 1000));
  const n = 1 + Math.floor(Math.max(0, lp - 3.5) * 2.4), spread = 0.08 + 0.12 * Math.max(0, lp - 4);
  const delay = T_COVER + d3.geoDistance([lon, lat], AMS) / Math.PI * COVER_SPAN;
  for (let k = 0; k < n; k++) {
    const a = rnd() * Math.PI * 2, r = k ? spread * Math.sqrt(rnd()) : 0;
    BARS.push({ ll: [lon + Math.cos(a) * r / Math.cos(lat * Math.PI / 180), lat + Math.sin(a) * r],
      h: (0.003 + 0.019 * Math.min(1, Math.max(0, lp - 3.5) / 3.6)) * (0.5 + rnd()),
      c: Math.floor(rnd() * PERIOD_COLOURS.length), at: delay + rnd() * 0.25 });
  }
}
// The buildings on the globe, lit: the period colours lifted so the darkest still read on dark land, drawn on their
// own layer, then laid over twice more, blurred and added, as the glow of a lit city.
const LIT = PERIOD_COLOURS.map(c => d3.color(c).brighter(0.9).formatHex());
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lg = layer.getContext('2d');
const coverage = t => ease(clamp01((t - T_COVER) / (COVER_SPAN + 0.6)));
function drawBars(p, t) {
  const [cx, cy] = p.translate(), centre = [centreLon(t), centreLat(t)];
  const paths = LIT.map(() => new Path2D());
  for (const b of BARS) {
    const grow = ease(clamp01((t - b.at) / 0.5));
    if (grow <= 0 || d3.geoDistance(b.ll, centre) > Math.PI / 2 - 0.03) continue;
    const [x, y] = p(b.ll), k = 1 + b.h * grow;
    paths[b.c].moveTo(x, y); paths[b.c].lineTo(cx + (x - cx) * k, cy + (y - cy) * k);
  }
  lg.clearRect(0, 0, W, H); lg.lineWidth = 1.7; lg.lineCap = 'round';
  paths.forEach((pa, i) => { lg.strokeStyle = LIT[i]; lg.stroke(pa); });
  const k = coverage(t);
  g.drawImage(layer, 0, 0);
  g.save(); g.globalCompositeOperation = 'lighter';
  g.filter = 'blur(5px)'; g.globalAlpha = 0.55 * k; g.drawImage(layer, 0, 0);
  g.filter = 'blur(18px)'; g.globalAlpha = 0.45 * k; g.drawImage(layer, 0, 0);
  g.restore();
}

const imgCache = new Map();
// The films run at double speed: the cities grow faster, and each ends on its full city.
// They start 3 s into each recording, where the city has begun to fill in, and run 1.4 times as fast: slow enough
// that every film, St. Petersburg's included, is still growing when the camera pushes in on it.
const SPEED = 1.4, OFFSET = 3;
function frame(id, t) {
  const n = FRAMES[id] || 1, k = Math.min(n, 1 + Math.round(OFFSET * FPS) + Math.floor(t * FPS * SPEED)), src = `f/${id}/${String(k).padStart(3, '0')}.jpg`;
  if (!imgCache.has(src)) { const im = new Image(); im.src = src; imgCache.set(src, im.decode().then(() => im).catch(() => null)); }
  return imgCache.get(src);
}

function projection(t, scale = 1) {
  return d3.geoOrthographic().scale(R * scale * globeZoom(t)).translate([CX, CY]).rotate([-centreLon(t), -centreLat(t)]).clipAngle(90);
}
const visible = (p, lonlat, t) => d3.geoDistance(lonlat, [centreLon(t), centreLat(t)]) < Math.PI / 2 - 0.02;

function card(im, x, y, w, h, alpha = 1) {
  if (!im || w < 2) return;
  g.save(); g.globalAlpha = alpha;
  if (w > 300) { g.drawImage(im, x - w / 2, y - h / 2, w, h); g.restore(); return; }   // a grid cell
  const rr = Math.min(6, w / 20);
  g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 24; g.shadowOffsetY = 6;
  g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, rr); g.fillStyle = '#111'; g.fill();
  g.shadowColor = 'transparent'; g.clip(); g.drawImage(im, x - w / 2, y - h / 2, w, h);
  g.restore();
  g.save(); g.globalAlpha = alpha * 0.7; g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, rr);
  g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 1.2; g.stroke(); g.restore();
}
function text(s, x, y, size, weight = 700, color = '#fff', align = 'left') {
  g.font = `${weight} ${size}px "Helvetica Neue", Arial, sans-serif`; g.fillStyle = color; g.textAlign = align; g.fillText(s, x, y);
}

// The camera on the grid: a zoom and the point it looks at, between the push-ins.
function gridFocus(t) {
  const at = id => { const c = gridCell(ORDER.indexOf(id) + 1); return [c.x, c.y]; };
  const pts = GRID_SHOTS.map(([k, , id]) => [k, id ? at(id) : [W / 2, H / 2]]);
  return [keyed(pts.map(p => [p[0], p[1][0]]), t), keyed(pts.map(p => [p[0], p[1][1]]), t)];
}
// The look point stays far enough from the edges that a push-in never shows past the grid.
function gridFocusClamped(t, z) {
  const [fx, fy] = gridFocus(t), hw = W / (2 * z), hh = H / (2 * z);
  return [Math.min(W - hw, Math.max(hw, fx)), Math.min(H - hh, Math.max(hh, fy))];
}
function gridCam(t, draw) {
  const z = keyed(GRID_SHOTS.map(k => [k[0], k[1]]), t), [fx, fy] = gridFocusClamped(t, z);
  g.save(); g.translate(W / 2 - fx * z, H / 2 - fy * z); g.scale(z, z); draw(); g.restore();
}

async function renderFrame(i) {
  const t = i / FPS / SLOW;
  g.fillStyle = '#0b0b0b'; g.fillRect(0, 0, W, H);
  const ims = Object.fromEntries(await Promise.all(ORDER.map(async id => [id, await frame(id, t)])));

  // the globe arrives as the grid splits
  const gin = ease(clamp01((t - T_SPLIT) / (T_ORBIT - T_SPLIT + 0.4)));
  if (gin > 0) {
    // As the world fills with buildings the globe lights up: a warm halo, lighter land, and in the last two seconds
    // the camera eases in.
    const k = coverage(t), push = ease(clamp01((t - (T_END - 2.4)) / 2.4));
    const p = projection(t, lerp(0.86, 1, gin) * (1 + 0.1 * push)), path = d3.geoPath(p, g), r = p.scale();
    g.save(); g.globalAlpha = gin;
    if (globeZoom(t) < 1.6) {
      const a = 0.18 + 0.82 * k, halo = g.createRadialGradient(CX, CY, r * 0.96, CX, CY, r * 1.42);
      halo.addColorStop(0, `rgba(255,150,80,${0.5 * a})`); halo.addColorStop(0.22, `rgba(255,105,55,${0.2 * a})`);
      halo.addColorStop(0.6, `rgba(236,40,20,${0.06 * a})`); halo.addColorStop(1, 'rgba(236,0,0,0)');
      g.fillStyle = halo; g.fillRect(0, 0, W, H);
    }
    // Sunrise in the last seconds: the sun comes up from behind the upper right edge of the globe.
    const sunK = ease(clamp01((t - (T_END - 3.6)) / 3.2)), SA = -0.62;
    const sx = CX + Math.cos(SA) * (r + lerp(-40, 48, sunK)), sy = CY + Math.sin(SA) * (r + lerp(-40, 48, sunK));
    if (sunK > 0) {
      const sg = g.createRadialGradient(sx, sy, 0, sx, sy, 620);
      sg.addColorStop(0, `rgba(255,248,230,${sunK})`); sg.addColorStop(0.05, `rgba(255,214,150,${0.85 * sunK})`);
      sg.addColorStop(0.25, `rgba(255,150,80,${0.28 * sunK})`); sg.addColorStop(1, 'rgba(255,120,60,0)');
      g.fillStyle = sg; g.fillRect(0, 0, W, H);
    }
    const grad = g.createRadialGradient(CX - r * .35, CY - r * .4, r * .1, CX, CY, r * 1.05);
    grad.addColorStop(0, d3.interpolateRgb('#1d2124', '#2a2622')(k)); grad.addColorStop(1, d3.interpolateRgb('#0f1113', '#141110')(k));
    g.beginPath(); path({ type: 'Sphere' }); g.fillStyle = grad; g.fill();
    g.beginPath(); path(d3.geoGraticule10()); g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 1; g.stroke();
    g.beginPath(); path(land); g.fillStyle = d3.interpolateRgb('#33393e', '#4a4744')(k); g.fill();
    // the rim catches the light
    g.beginPath(); path({ type: 'Sphere' }); g.strokeStyle = `rgba(255,${Math.round(lerp(255, 190, k))},${Math.round(lerp(255, 140, k))},${0.14 + 0.4 * k})`; g.lineWidth = 1 + k; g.stroke();
    if (t > T_COVER) drawBars(p, t);

    // arcs: Paris → Amsterdam, then Amsterdam → everyone
    for (const [id, , lon, lat] of CITIES) {
      if (id === 'paris') continue;
      const from = id === 'amsterdam' ? [2.35, 48.86] : [4.90, 52.37], at = LAND_AT[id];
      const k = ease(clamp01((t - (at - FLY * 0.5)) / (FLY * 0.6)));
      if (k <= 0) continue;
      const ip = d3.geoInterpolate(from, [lon, lat]);
      const line = { type: 'LineString', coordinates: d3.range(0, 1.0001, 0.02).filter(s => s <= k).map(ip) };
      g.beginPath(); path(line);
      g.strokeStyle = id === 'amsterdam' ? RED : `rgba(236,0,0,${t > at + 0.6 ? .35 : .8})`; g.lineWidth = id === 'amsterdam' ? 2.5 : 1.6; g.stroke();
    }
    // dots, pulsing once a city has landed
    for (const [id, name, lon, lat] of CITIES) {
      const at = LAND_AT[id];
      if (t < at || !visible(p, [lon, lat], t)) continue;
      const [x, y] = p([lon, lat]), age = t - at;
      const pulse = ((age + ORDER.indexOf(id) * 0.17) % 1.6) / 1.6;
      g.beginPath(); g.arc(x, y, 5 + pulse * 22, 0, 7); g.strokeStyle = `rgba(236,0,0,${(1 - pulse) * .8})`; g.lineWidth = 2; g.stroke();
      const pop = age < 0.25 ? 1 + (0.25 - age) * 4 : 1;
      g.save(); g.shadowColor = RED; g.shadowBlur = 16; g.beginPath(); g.arc(x, y, 5 * pop, 0, 7); g.fillStyle = '#ff2a1a'; g.fill(); g.restore();
      // only the two that started it carry their names
      if ((id === 'paris' || id === 'amsterdam') && t < T_TURN + 0.4) {
        const a = clamp01(age / 0.3) * (1 - clamp01((t - T_TURN) / 0.4));
        g.save(); g.globalAlpha = a;
        if (id === 'paris') text(name, x - 14, y + 26, 22, 700, '#fff', 'right'); else text(name, x + 14, y - 12, 22, 700, '#fff', 'left');
        g.restore();
      }
    }
    if (sunK > 0) {
      // daylight washing over the near side
      g.save(); g.beginPath(); path({ type: 'Sphere' }); g.clip();
      const lx = CX + Math.cos(SA) * r, ly = CY + Math.sin(SA) * r, day = g.createRadialGradient(lx, ly, 0, lx, ly, r * 1.5);
      day.addColorStop(0, `rgba(255,214,160,${0.42 * sunK})`); day.addColorStop(0.45, `rgba(255,170,110,${0.12 * sunK})`); day.addColorStop(1, 'rgba(255,150,90,0)');
      g.globalCompositeOperation = 'lighter'; g.fillStyle = day; g.fillRect(0, 0, W, H); g.restore();
      // the bright edge of the planet where the light comes round
      g.save(); g.globalCompositeOperation = 'lighter';
      for (const [wd, al, bl] of [[2, 0.95, 6], [7, 0.35, 22]]) {
        g.beginPath(); g.arc(CX, CY, r, SA - 0.75 * sunK - 0.05, SA + 0.75 * sunK + 0.05);
        g.strokeStyle = `rgba(255,236,200,${al * sunK})`; g.lineWidth = wd; g.shadowColor = 'rgba(255,200,140,1)'; g.shadowBlur = bl; g.stroke();
      }
      // the sun itself, only where it clears the planet
      g.beginPath(); g.rect(0, 0, W, H); g.arc(CX, CY, r, 0, Math.PI * 2, true); g.clip('evenodd');
      g.beginPath(); g.arc(sx, sy, 14, 0, 7); g.fillStyle = `rgba(255,252,240,${sunK})`; g.shadowColor = '#ffd9a0'; g.shadowBlur = 40; g.fill();
      g.restore();
      // a thin anamorphic streak and two faint ghosts on the line to the centre
      g.save(); g.globalCompositeOperation = 'lighter';
      const st = g.createLinearGradient(sx - 700, 0, sx + 700, 0);
      st.addColorStop(0, 'rgba(255,190,130,0)'); st.addColorStop(0.5, `rgba(255,236,210,${0.7 * sunK})`); st.addColorStop(1, 'rgba(255,190,130,0)');
      g.fillStyle = st; g.fillRect(sx - 700, sy - 1.5, 1400, 3);
      for (const [f, rad, al] of [[0.55, 26, 0.10], [1.35, 46, 0.06]]) {
        g.beginPath(); g.arc(lerp(sx, CX, f), lerp(sy, CY, f), rad, 0, 7); g.fillStyle = `rgba(255,200,150,${al * sunK})`; g.fill();
      }
      g.restore();
    }
    g.restore();
  }

  // the films: grid → orbit → their city
  const p = projection(t);
  ORDER.forEach((id, i) => {
    const im = ims[id], c = gridCell(i + 1), o = orbit[id], at = LAND_AT[id];
    const city = CITIES.find(c => c[0] === id);
    if (t < T_SPLIT) { gridCam(t, () => card(im, c.x, c.y, c.w - 2, c.h - 2)); return; }
    const s = ease(clamp01((t - T_SPLIT - i * 0.02) / (T_ORBIT - T_SPLIT)));
    let x = lerp(c.x, o.x, s), y = lerp(c.y, o.y, s), w = lerp(c.w - 2, o.w, s), h = lerp(c.h - 2, o.h, s);
    // a gentle drift while waiting
    if (s >= 1) { x += Math.sin(t * 1.3 + i) * 4; y += Math.cos(t * 1.1 + i * 2) * 4; }
    const f = clamp01((t - (at - FLY)) / FLY);
    if (f >= 1) return;
    if (f > 0) {
      const [tx, ty] = p([city[2], city[3]]), e = ease(f);
      // the card rises a little, then dives to its city
      const mx = (x + tx) / 2, my = Math.min(y, ty) - 120;
      x = (1 - e) ** 2 * x + 2 * (1 - e) * e * mx + e * e * tx;
      y = (1 - e) ** 2 * y + 2 * (1 - e) * e * my + e * e * ty;
      const big = id === 'paris' || id === 'amsterdam' ? 1.5 : 1;
      const grow = Math.sin(Math.min(1, f * 1.6) * Math.PI) * 0.35 * big;
      w = lerp(o.w, 10, e) * (1 + grow); h = lerp(o.h, 7.5, e) * (1 + grow);
      card(im, x, y, w, h, 1 - clamp01((f - 0.85) / 0.15));
      return;
    }
    card(im, x, y, w, h);
  });

  // the title cell in the grid, then the closing words
  if (t < T_SPLIT + 0.6) {
    const a = 1 - clamp01((t - T_SPLIT) / 0.6), c = gridCell(0);
    g.save(); g.globalAlpha = a;
    if (t < T_SPLIT) { const z = keyed(GRID_SHOTS.map(k => [k[0], k[1]]), t), [fx, fy] = gridFocusClamped(t, z); g.translate(W / 2 - fx * z, H / 2 - fy * z); g.scale(z, z); }
    g.fillStyle = '#0b0b0b'; g.fillRect(c.x - 180, c.y - 135, 360, 270);
    text('Building', 26, 76, 44, 800); text('by building', 26, 122, 44, 800);
    g.font = '400 15px "Helvetica Neue", Arial, sans-serif'; g.fillStyle = '#b9c0c4';
    ['15 city maps, each coloured by the year', 'its buildings went up. It started with', 'Paris, building by building.'].forEach((l, k) => g.fillText(l, 26, 200 + k * 21));
    g.restore();
  }
}
window.renderFrame = renderFrame;
</script>
